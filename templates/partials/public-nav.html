{{define "partial/public-nav"}}
<nav class="fixed top-0 left-0 right-0 z-50 border-b border-gray-200/80 bg-white/80 backdrop-blur-lg">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-1.5 group">
      <img src="/static/logo.svg" alt="NoTalk Logo" class="w-12 h-12">
      <span class="text-lg font-bold text-gray-900">NoTalk</span>
    </a>
    <!-- Desktop nav -->
    <div class="hidden sm:flex items-center gap-1">
      <a href="/about" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100/60 transition-colors">About</a>
      <div class="w-px h-6 bg-gray-200 mx-2"></div>
      <a href="/login" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100/60 transition-colors">Sign in</a>
      {{if .Data.RegistrationEnabled}}
      <a href="/register" class="ml-1 px-4 py-2 text-sm font-medium rounded-lg bg-brand-500 text-white hover:bg-brand-600 transition-colors shadow-sm">Get started</a>
      {{end}}
    </div>
    <!-- Mobile hamburger -->
    <div class="sm:hidden" x-data="{ mobileMenu: false }">
      <button @click="mobileMenu = !mobileMenu" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
        <svg x-show="!mobileMenu" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="mobileMenu" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
      <div x-show="mobileMenu" x-cloak @click.away="mobileMenu = false"
           x-transition:enter="transition ease-out duration-150"
           x-transition:enter-start="opacity-0 -translate-y-1"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-100"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-1"
           class="absolute top-full right-4 mt-1 w-48 bg-white border border-gray-200 rounded-xl shadow-lg py-2 z-50">
        <a href="/about" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">About</a>
        <div class="border-t border-gray-100 my-1"></div>
        <a href="/login" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Sign in</a>
        {{if .Data.RegistrationEnabled}}
        <a href="/register" class="block px-4 py-2 text-sm font-medium text-brand-800 hover:bg-brand-50">Get started</a>
        {{end}}
      </div>
    </div>
  </div>
</nav>
<!-- Spacer for fixed navbar -->
<div class="h-16"></div>
{{end}}
