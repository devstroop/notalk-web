{{define "component/textarea"}}
{{/* Usage: {{template "component/textarea" (dict "label" "Message" "name" "body" "rows" "3" "placeholder" "..." "required" "1")}} */}}
<div class="form-row">
  {{if .label}}<label class="block text-sm font-medium text-gray-700 mb-1">{{.label}}{{if .required}} <span class="text-destructive">*</span>{{end}}</label>{{end}}
  <textarea{{if .xmodel}} x-model="{{.xmodel}}"{{end}} class="w-full px-3 py-2 border border-input rounded-lg text-sm bg-background focus:ring-2 focus:ring-ring focus:border-ring outline-hidden resize-y" name="{{.name}}" rows="{{if .rows}}{{.rows}}{{else}}3{{end}}"{{if .placeholder}} placeholder="{{.placeholder}}"{{end}}{{if .required}} required{{end}}>{{if .value}}{{.value}}{{end}}</textarea>
  {{if .hint}}<p class="text-xs text-muted-foreground mt-1">{{.hint}}</p>{{end}}
</div>
{{end}}
