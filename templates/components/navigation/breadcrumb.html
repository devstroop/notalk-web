{{define "component/navigation/breadcrumb"}}
{{/* Usage: {{template "component/navigation/breadcrumb" (dict "parentLabel" "Accounts" "parentHref" "/accounts" "current" "Sales")}} — fixed two-level trail. */}}
<nav aria-label="Breadcrumb" class="flex items-center gap-1.5 text-sm text-gray-500 mb-4">
  <a href="{{.parentHref}}" class="hover:text-gray-800 transition-colors">{{.parentLabel}}</a>
  <svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
  <span class="font-medium text-gray-900 truncate">{{.current}}</span>
</nav>
{{end}}
