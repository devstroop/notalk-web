{{define "component/input"}}
{{/* Usage: {{template "component/input" (dict "label" "Email" "name" "email" "type" "email" "placeholder" "you@co.com" "required" "1" "hint" "Shown nowhere." "value" "")}} */}}
<div class="form-row">
  {{if .label}}<label class="block text-sm font-medium text-gray-700 mb-1"{{if .id}} for="{{.id}}"{{end}}>{{.label}}{{if .required}} <span class="text-destructive">*</span>{{end}}</label>{{end}}
  <input{{if .id}} id="{{.id}}"{{end}} class="w-full px-3 py-2 border border-input rounded-lg text-sm bg-background focus:ring-2 focus:ring-ring focus:border-ring outline-hidden" name="{{.name}}" type="{{if .type}}{{.type}}{{else}}text{{end}}"{{if .placeholder}} placeholder="{{.placeholder}}"{{end}}{{if .value}} value="{{.value}}"{{end}}{{if .required}} required{{end}}{{if .minlength}} minlength="{{.minlength}}"{{end}}{{if .autocomplete}} autocomplete="{{.autocomplete}}"{{end}}{{if .autofocus}} autofocus{{end}} />
  {{if .hint}}<p class="text-xs text-muted-foreground mt-1">{{.hint}}</p>{{end}}
</div>
{{end}}
