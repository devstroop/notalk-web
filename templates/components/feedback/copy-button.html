{{define "component/feedback/copy-button"}}
{{/* Usage: {{template "component/feedback/copy-button" (dict "value" "abc123" "label" "Copy")}} — copies data-copy via app.js delegation; value travels in a data attribute (quote-safe). */}}
<button type="button" data-copy="{{.value}}" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
  <span>{{if .label}}{{.label}}{{else}}Copy{{end}}</span>
</button>
{{end}}
